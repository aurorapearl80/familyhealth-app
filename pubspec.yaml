name: familyhealth
description: Family Watch Today - Your health, decoded with precision.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.0
  google_maps_flutter: ^2.6.0
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.4.0
  provider: ^6.1.2
  lottie: ^3.0.0
  connectivity_plus: ^6.1.1
  sqflite: ^2.3.3
  shared_preferences: ^2.3.1
  path: ^1.9.0
  # Video calling via LiveKit WebRTC
  livekit_client: ^2.3.0
  file_picker: ^8.1.3
  # GPS tracking + push notifications
  geolocator: ^13.0.2
  onesignal_flutter: ^5.2.10
  workmanager: ^0.9.0
  # Real-time chat delivery on top of the REST messaging API
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ic_launcher.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/ic_launcher.png"

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
